# The book. Deploys worker/notion-book.js to Cloudflare.
#
# Nothing secret goes in this file. Jook_joint is a public repo, so the
# Notion token and the database id are set as secrets on the deployed
# worker instead, and they survive every later deploy. See README.md.

name = "jook-joint"
main = "notion-book.js"
compatibility_date = "2026-09-18"

# No [vars] block on purpose. NOTION_TOKEN and NOTION_DB are secrets.

# Keep logs after the fact, so a failed write can be read later instead of
# only while a live stream happens to be open.
[observability]
enabled = true
